#############################################
# MISC SETTINGS
#############################################

# Disable tiling animations weirdness
animate_manual_resizes = false

# Resize speed smoothing
resize_on_border = true

# Disable window swallowing quirks
focus_on_activate = true


#####################
# LAYOUT
#####################

general {
    gaps_in = 2
    gaps_out = 3
    border_size = 1
}

decoration {
    rounding = 12

    blur = true
    blur_size = 8
    blur_passes = 3
}
