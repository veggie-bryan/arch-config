#############################################
# MISC SETTINGS
#############################################

# Disable tiling animations weirdness
animate_manual_resizes = false

# Gaps
gaps_in = 4
gaps_out = 4

# Border
border_size = 2

# Rounding
rounding = 12

# Resize speed smoothing
resize_on_border = true

# Disable window swallowing quirks
focus_on_activate = true