#############################################
# Environment (SDDM / Wayland fix)
#############################################

exec-once = dbus-update-activation-environment --systemd DBUS_SESSION_BUS_ADDRESS DISPLAY XAUTHORITY WAYLAND_DISPLAY


#############################################
# Wallpaper (swww)
#############################################

exec-once = swww-daemon
exec-once = ~/.config/hypr/wallpaper.sh


#############################################
# Waybar
#############################################

exec-once = waybar


#############################################
# System tray helpers
#############################################

exec-once = nm-applet
exec-once = udiskie


#############################################
# Optional: force starting workspace
#############################################

# Uncomment if you want to always start on workspace 1
# exec-once = sleep 2 && hyprctl dispatch workspace 1
