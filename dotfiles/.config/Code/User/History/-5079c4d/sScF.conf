# Initialize main widgets
exec-once = dbus-update-activation-environment --systemd DBUS_SESSION_BUS_ADDRESS DISPLAY XAUTHORITY WAYLAND_DISPLAY
exec-once = swww-daemon
exec-once = ~/.config/hypr/wallpaper.sh
exec-once = waybar
exec-once = nm-applet
exec-once = udiskie

# Dashboard (workspace 3)
exec-once = [silent workspace 3] spotify
exec-once = [silent workspace 3] obsidian
exec-once = [silent workspace 3] kitty --class dash-btm -e bottom

# Force initial workspace
exec-once = sleep 2 && hyprctl dispatch workspace 1
